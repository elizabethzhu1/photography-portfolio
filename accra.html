        .photo-frame:nth-child(even) .gallery-photo {

            font-weight: 500;

        .fade-in.loaded {

        @media (max-width: 767px) {

<body class="bg-white font-sans min-h-screen">

    <div id="photo-modal" style="display:none; position:fixed; z-index:50; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">

    <main class="site-content city-content">
        <p class="accra-title">Adventures in Accra</p>
        <p class="accra-subtitle">On a three week study abroad program in Accra, the capital city of Ghana.</p>
        <div class="collage-outer">
            <div class="city-strip">
                <figure class="photo-frame">
                    <img data-src="/public/accra/Zhu_1.jpg" class="gallery-photo" width="1800" height="1200" alt="Rainbow of Beads" loading="lazy" />
                    <figcaption class="photo-caption"><strong>1. Rainbow of Beads</strong>I took this at the Koforidua Bead Market, one of the largest bead markets in Ghana. Beads occupy an important role in Ghanaian culture and history. Historically, beads were used by the indigenous peoples as trade currency. Nowadays, Ghanaian beads remain rich with symbolic value — depending on the color and composition of the beads, they may represent royalty, purity, wealth, fertility, and so forth. At the market, I found beads of all shapes and sizes, from waist beads to bracelets to necklaces, and bought many beads. </figcaption>
                </figure>
                <figure class="photo-frame">
                    <img data-src="/public/accra/Zhu_2.jpg" class="gallery-photo" width="1800" height="1200" alt="Yin and Yang" loading="lazy" />
                    <figcaption class="photo-caption"><strong>2. Yin and Yang</strong>As I was strolling through the Cantonments, I saw a family of goats walking by — I saw one black goat, a white infant, and a black and white infant who took on the colors of its companions. Whereas one would not ordinarily find goats on the streets of a typical American city, these friendly creatures are regulars in the urban fabric of Accra. In addition, they play a vital role in Ghanaian culture and life — they are raised to provide a source of income, consumed as food, granted as part of dowries, and present in certain cultural processions. One of my Ghanaian friends in the program has a pet goat named Chloe, which is a perfect name for a goat.</figcaption>
                </figure>
                <figure class="photo-frame">
                    <img data-src="/public/accra/Zhu_3.jpg" class="gallery-photo" width="1800" height="1200" alt="Carrots in the Sun" loading="lazy" />
                    <figcaption class="photo-caption"><strong>3. Carrots in the Sun</strong>As I strolled through the streets of Accra, I caught a glimpse of the sunlight perfectly hitting a bowl with a single carrot, nestled in between baskets and a pile of other carrots. I was drawn to the complementary colors and the interplay between light and dark in taking this shot. On the streets of Accra, it is common to see fresh produce laying on tabletops either unattended to or piled up in a pyramid by a street vendor who is determined to sell you some vegetables. </figcaption>
                </figure>
                <figure class="photo-frame">
                    <img data-src="/public/accra/Zhu_4.jpg" class="gallery-photo" width="1800" height="1200" alt="Cocoa Beans" loading="lazy" />
                    <figcaption class="photo-caption"><strong>4. Cocoa Beans</strong>This was taken at the Tetteh Quarshie cocoa farm, where the first cocoa tree was planted in Ghana! In 1876, Tetteh Quarshie smuggled six cocoa pods from modern-day Equatorial Guinea into Ghana. Ghana is the second largest exporter of cocoa in the world behind Côte d'Ivoire. Here, cocoa beans are extracted from the pods and wrapped within plantain leaves to ferment. Afterwards, the beans are dried and sent to a processing facility, typically to places in Europe and North America, where they are roasted, ground, and refined to produce chocolate.</figcaption>
                </figure>
                <figure class="photo-frame">
                    <img data-src="/public/accra/Zhu_5.jpg" class="gallery-photo" width="1800" height="1200" alt="Rooster on the Block" loading="lazy" />
                    <figcaption class="photo-caption"><strong>5. Rooster on the Block</strong>Roosters in Accra are a bit like pigeons in New York — they command the streets like locals by strutting amongst traffic, guiding their chicks, and loudly declaring their presence early in the morning. Most Ghanaian families do not cage their chickens, instead choosing to let them roam around freely on the streets. Roosters also hold cultural and religious significance, at times even inspiring the design of fantasy coffins used to bury the dead. In fact, the Convention People's Party founded by Kwame Nkrumah bears a rooster as its logo, as a symbol for awakening.</figcaption>
                </figure>
                <figure class="photo-frame">
                    <img data-src="/public/accra/Zhu_6.jpg" class="gallery-photo" width="1800" height="1200" alt="Gye Nyame" loading="lazy" />
                    <figcaption class="photo-caption"><strong>6. Gye Nyame</strong>I took this at the Kakum National Park during our trip to Cape Coast. The bags were being sold by a vendor right by the entrance to the forest. Leather craftsmanship is a rich part of Ghanaian culture and each bag is carefully handcrafted. The black symbol on the bag in the top left corner is a well-known Adinkra symbol originating from the Akan people. It means "Except God" and represents the divine authority of God. This symbol is found all across Accra, not only on leather bags but on the back of trotros, wooden keychains, in paintings, and in shop names.</figcaption>
                </figure>
                <figure class="photo-frame">
                    <img data-src="/public/accra/Zhu_7.jpg" class="gallery-photo" width="1800" height="1200" alt="Straw Hats, Slippers, Drums" loading="lazy" />
                    <figcaption class="photo-caption"><strong>7. Straw Hats, Slippers, Drums</strong>This was one of the vendor tables at the Koforidua Bead Market. Pictured are Ghanaian straw hats of three different varieties, some slippers, and some Ghanaian wooden drums. The hourglass shape is a standard feature of Ghanaian drums, along with the string surrounding the body of the drum. Although the table features three different cultural items, they share similar materials - cow skin is used to make both the drums and the slippers shown.</figcaption>
                </figure>
                <figure class="photo-frame">
                    <img data-src="/public/accra/Zhu_8.jpg" class="gallery-photo" width="1800" height="1200" alt="Old Car" loading="lazy" />
                    <figcaption class="photo-caption"><strong>8. Old Car</strong>A staple of the streets of Accra are worn, vintage cars. As I walked past this particular car in the Cantonments neighborhood, I was struck by how the light illuminated the car, creating a shadow on the pavement below, as well as how the scratches on the car contrasted to the sleek, colorful green and blue trailers in the background. In particular, I have noticed that Accra is home to a lot of blue - not only does blue make an appearance in trailers like the one depicted, but it is the color of street signs, water bottle caps, shawarma trucks, ATMs, plastic chairs, and countless other items native to Accra.</figcaption>
                </figure>
                <figure class="photo-frame">
                    <img data-src="/public/accra/Zhu_9.jpg" class="gallery-photo" width="1800" height="1200" alt="Africa Unite" loading="lazy" />
                    <figcaption class="photo-caption"><strong>9. Africa Unites</strong>This photo was taken on Oxford Street after I had an unexpected conversation in French with a street vendor from Burkina Faso. Often, on Oxford Street, economic exchanges inevitably turn into socio-cultural exchanges. The vendor initially spread out the various plaques from his store on the ground to give us a better view of his products and to convince us to make a purchase. The plaques center around concepts of Panafricanism, religion, unity, maternity, and perseverance. The colors of the traditional Ghanaian fabric juxtapose with the stark black and white text and borders of the plaques.</figcaption>
                </figure>
                <figure class="photo-frame">
                    <img data-src="/public/accra/Zhu_10.jpg" class="gallery-photo" width="1800" height="1200" alt="Cat and Cloth" loading="lazy" />
                    <figcaption class="photo-caption"><strong>10. Cat and Cloth</strong>I was strolling down Oxford Street when I noticed this cat peeping underneath some colorful fabrics at a street vendor's shop. Fabrics like these are staples of Ghanaian culture — it is impossible to walk around the neighborhood without running into at least a dozen vendors selling dyed fabrics characterized by vibrant and colorful patterns. Before taking this shot, I was heckled by two competing vendors. In my three weeks here, I've realized that Oxford Street is home to unabashedly determined vendors who will do whatever it takes to sell their goods, even if you are in the middle of buying clothes from a competing vendor. This particular shop sold pants, dresses, tablecloths, and other clothing made out of similar fabrics to the ones depicted.</figcaption>
                </figure>
            </div>
        </div>
    </main>
    <script>
        const modal = document.getElementById('photo-modal');
        const modalImg = document.getElementById('modal-img');
        const closeBtn = document.getElementById('modal-close');

        document.querySelectorAll('.collage-outer img').forEach((img, index) => {
            img.classList.add('fade-in');
            img.decoding = 'async';
            img.loading = index < 4 ? 'eager' : 'lazy';
            img.fetchPriority = index < 4 ? 'high' : 'low';

            const reveal = () => {
                requestAnimationFrame(() => {
                    img.classList.add('loaded');
                });
            };

            img.addEventListener('load', function() {
                if (this.decode) {
                    this.decode().catch(() => {}).finally(reveal);
                } else {
                    reveal();
                }
            }, { once: true });

            img.addEventListener('click', function() {
                modal.style.display = 'flex';
                modalImg.src = this.currentSrc || this.src || this.dataset.src;
                modalImg.alt = this.alt;
            });

            img.addEventListener('error', function() {
                this.classList.remove('fade-in');
            }, { once: true });

            img.src = img.dataset.src;

            if (img.complete && img.naturalWidth > 0) {
                if (img.decode) {
                    img.decode().catch(() => {}).finally(reveal);
                } else {
                    reveal();
                }
            }
        });

        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
            modalImg.src = '';
        });

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.style.display = 'none';
                modalImg.src = '';
            }
        });

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                modal.style.display = 'none';
                modalImg.src = '';
            }
        });
    </script>
</body>
