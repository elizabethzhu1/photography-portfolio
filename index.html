<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Zhu Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .masonry {
            display: flex;
            gap: 1.5rem;
            padding: 0;
        }
        .masonry-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .masonry img {
            width: 100%;
            height: auto;
            border-radius: 0;
            display: block;
            background: #f3f3f3;
            opacity: 0;
            transition: opacity 1s cubic-bezier(.4,2,.6,1);
            loading: lazy;
        }
        @media (max-width: 639px) {
            .masonry {
                flex-direction: column;
            }
        }
        .masonry img.fade-in {
            opacity: 1;
        }
        .photo-anim-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            min-height: 600px;
            overflow: visible;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .photo-anim-container.loaded {
            opacity: 1;
        }
        .photo-anim-img {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 420px;
            max-width: 80vw;
            height: auto;
            transform: translate(-50%, -50%) scale(1);
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            transition: transform 0.6s cubic-bezier(.4,2,.6,1), left 0.6s cubic-bezier(.4,2,.6,1), top 0.6s cubic-bezier(.4,2,.6,1), opacity 0.6s cubic-bezier(.4,2,.6,1);
            opacity: 0;
            z-index: 2;
        }
        .photo-anim-img.loaded {
            opacity: 1;
        }
        .photo-anim-img.fanned {
            /* Will be set by JS for each image */
        }
        .photo-anim-img.grid {
            /* Will be set by JS for each image */
            transition: all 1s cubic-bezier(.4,2,.6,1);
        }
        @media (max-width: 600px) {
            .photo-anim-img { width: 90vw; }
        }
        .loading-placeholder {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            background: #f3f3f3;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            z-index: 1;
        }
    </style>
</head>
<body class="bg-white font-sans min-h-screen">
    <!-- Loading Placeholder -->
    <!-- <div id="loading-placeholder" class="loading-placeholder"></div> -->
    
    <!-- Modal HTML -->
    <div id="photo-modal" style="display:none; position:fixed; z-index:50; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
        <span id="modal-close" style="position:absolute; top:32px; right:48px; color:white; font-size:2.5rem; cursor:pointer; z-index:51;">&times;</span>
        <img id="modal-img" src="" alt="modal photo" style="max-width:90vw; max-height:90vh; box-shadow:0 4px 32px rgba(0,0,0,0.5);" />
    </div>
    <!-- Header -->
    <header class="px-4 sm:px-8 pt-4 sm:pt-6 ml-5 mt-7">
        <h1 class="text-3xl sm:text-5xl md:text-2xl lg:text-3xl xl:text-5xl font-extrabold tracking-tight text-black">ELIZABETH ZHU</h1>
        <nav class="mt-3 flex flex-wrap gap-2 sm:gap-3 md:gap-4 text-gray-500 text-base sm:text-md md:text-lg lg:text-xl lowercase overflow-x-auto">
            <a href="/about.html" class="hover:text-black whitespace-nowrap">about</a>
            <!-- <a href="contact.html" class="hover:text-black whitespace-nowrap">contact</a> -->
            <a href="#" class="text-black font-semibold border-b-2 border-black whitespace-nowrap" onclick="resetAndReload(); return false;">photography</a>
            <a href="/sf.html" class="hover:text-black whitespace-nowrap">san francisco</a>
            <a href="/trees.html" class="hover:text-black whitespace-nowrap">trees</a>
            <a href="/animals.html" class="hover:text-black whitespace-nowrap">animals</a>
        </nav>
    </header>
    <!-- Animated Photo Stack -->
    <!-- Main Gallery Grid -->
    <div id="main-gallery" style="opacity:1; pointer-events:auto; transition:opacity 0.8s;">
        <main class="px-2 sm:px-8 pb-12 py-2 ml-5 mr-5 mt-6">
            <div class="masonry">
                <div class="masonry-column" id="column1">
                    <!-- Column 1 images -->
                </div>
                <div class="masonry-column" id="column2">
                    <!-- Column 2 images -->
                </div>
                <div class="masonry-column" id="column3">
                    <!-- Column 3 images -->
                </div>
            </div>
        </main>
    </div>
    </main>
<script>

// Modal functionality
const modal = document.getElementById('photo-modal');
const modalImg = document.getElementById('modal-img');
const closeBtn = document.getElementById('modal-close');

// Function to reset animation and reload page
function resetAndReload() {
    localStorage.removeItem('hasSeenAnimation');
    window.location.reload();
}

// Photo list
const photoList = [
    'yosemitetrees.jpg', 'nycstreet.jpg', 'sfwoman.jpg', 'sfstreetview.jpg', 'goats.jpg',
    'lightonbuildings.jpg', 'nyclibrary.jpg', 'nyctower.jpg', 'leaves.jpg', 'skater.jpg',
    'light.jpg', 'palacefinearts.jpg', 'treebuilding.jpg', 'sfcrispbuilding.jpg',
    'sfbuilding.jpg', 'sftree.jpg', 'goldengate.jpg', 'sfshore.jpg', 'monkey.jpg',
    'coffeebeans.jpg', 'sfview.jpg', 'birds.jpg', 'benchsf.jpg', 'reyes.jpg',
    'ibipuera.jpg', 'swans.jpg', 'building.jpg', 'halfdome.jpg', 'beach.jpg', 'yosemite.jpg',
    'cypress.jpg', 'nyc.jpg', 'cntower.jpg', 'water.jpg', 'morebirds.jpg',
    'steps.jpg', 'sfhouse.jpg', 'whaletree.jpg'
];

// Create and add images to the gallery
const column1 = document.getElementById('column1');
const column2 = document.getElementById('column2');
const column3 = document.getElementById('column3');
const columns = [column1, column2, column3];

photoList.forEach((src, i) => {
    const img = document.createElement('img');
    img.src = `/${src}`;
    img.alt = `photo ${i+1}`;
    img.loading = 'lazy';
    img.style.cursor = 'pointer';
    
    // Add click handler for modal
    img.addEventListener('click', function() {
        modal.style.display = 'flex';
        modalImg.src = this.src;
        modalImg.alt = this.alt;
    });
    
    // Distribute images evenly across 3 columns
    const columnIndex = i % 3;
    columns[columnIndex].appendChild(img);
});

// Fade in images as they enter the viewport
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('fade-in');
            observer.unobserve(entry.target);
        }
    });
}, { threshold: 0.1 });

document.querySelectorAll('.masonry-column img').forEach(img => {
    observer.observe(img);
});

// Close modal on close button
closeBtn.addEventListener('click', function() {
    modal.style.display = 'none';
    modalImg.src = '';
});

// Close modal when clicking outside the image
modal.addEventListener('click', function(e) {
    if (e.target === modal) {
        modal.style.display = 'none';
        modalImg.src = '';
    }
});

// Close modal on Escape key
window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        modal.style.display = 'none';
        modalImg.src = '';
    }
});
</script>
</body>
</html>
