<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Zhu | New York</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100vh;
            overflow-y: hidden;
        }
        .collage-outer {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100vw;
            height: calc(100vh - 175px);
            -ms-overflow-style: none;
            scrollbar-width: none;
            overscroll-behavior-x: contain;
        }
        .collage-outer::-webkit-scrollbar,
        .collage-outer > div::-webkit-scrollbar {
            display: none;
        }
        .collage-outer > div {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .gallery-photo {
            width: auto;
            height: min(57vw, calc(100vh - 240px));
            max-width: 90vw;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
        }
        .fade-in {
            opacity: 0;
            transition: opacity 0.8s;
        }
        .fade-in.loaded {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-white font-sans min-h-screen">
    <header class="px-4 sm:px-8 pt-6 sm:pt-8 mt-5 ml-5">
        <h1 class="text-3xl sm:text-5xl md:text-2xl lg:text-3xl xl:text-5xl font-extrabold tracking-tight text-black">ELIZABETH ZHU</h1>
        <nav class="mt-3 flex flex-wrap gap-2 sm:gap-3 md:gap-4 text-gray-500 text-base sm:text-md md:text-lg lg:text-xl lowercase overflow-x-auto">
            <a href="/index.html" class="hover:text-black whitespace-nowrap">about</a>
            <a href="/main.html" class="hover:text-black whitespace-nowrap">photography</a>
            <a href="/accra.html" class="hover:text-black whitespace-nowrap">accra</a>
            <a href="/paris.html" class="hover:text-black whitespace-nowrap">paris</a>
            <a href="/new-york.html" class="text-black font-semibold border-b-2 border-black whitespace-nowrap">new york</a>
            <a href="/sf.html" class="hover:text-black whitespace-nowrap">san francisco</a>
        </nav>
    </header>
    <main class="px-4 sm:px-8 pb-32 ml-5">
        <div class="collage-outer">
            <div style="display: flex; gap: 32px; overflow-x: auto; padding: 32px 64px 32px 0; scrollbar-width: none; -ms-overflow-style: none; overscroll-behavior-x: contain;">
                <img data-src="/public/nyc/nyc.jpg" class="gallery-photo" alt="new york" loading="lazy" />
                <img data-src="/public/nyc/nyclibrary.jpg" class="gallery-photo" alt="new york library" loading="lazy" />
                <img data-src="/public/nyc/skater.jpg" class="gallery-photo" style="padding-right: 20px;" alt="new york skater" loading="lazy" />
                <img data-src="/public/nyc/nycstreet.jpg" class="gallery-photo" alt="new york street" loading="lazy" />
                <img data-src="/public/nyc/nyctower.jpg" class="gallery-photo" alt="new york tower" loading="lazy" />
            </div>
        </div>
    </main>
    <script>
        const scrollContainer = document.querySelector('.collage-outer > div');
        const totalWidth = scrollContainer.scrollWidth - scrollContainer.clientWidth;

        window.addEventListener('scroll', () => {
            const scrollProgress = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
            scrollContainer.scrollLeft = totalWidth * scrollProgress;
        });

        document.querySelectorAll('.collage-outer img').forEach(img => {
            img.addEventListener('load', function() {
                setTimeout(() => {
                    this.classList.add('loaded');
                }, 100);
            });

            if (img.complete) {
                setTimeout(() => {
                    img.classList.add('loaded');
                }, 100);
            }
        });
    </script>
</body>
</html>
