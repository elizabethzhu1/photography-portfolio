<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Zhu Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .masonry {
            display: flex;
            gap: 1rem;
            padding: 0;
        }
        .masonry-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .masonry img {
            width: 100%;
            height: auto;
            border-radius: 0;
            display: block;
            background: #f3f3f3;
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 0.7s ease, transform 0.7s ease;
            will-change: opacity, transform;
        }
        @media (max-width: 639px) {
            .masonry {
                flex-direction: column;
            }
        }
        .masonry img.fade-in {
            opacity: 1;
            transform: translateY(0);
        }
        .masonry img.loading {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .photo-anim-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            min-height: 600px;
            overflow: visible;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .photo-anim-container.loaded {
            opacity: 1;
        }
        .photo-anim-img {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 420px;
            max-width: 80vw;
            height: auto;
            transform: translate(-50%, -50%) scale(1);
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            transition: transform 0.6s cubic-bezier(.4,2,.6,1), left 0.6s cubic-bezier(.4,2,.6,1), top 0.6s cubic-bezier(.4,2,.6,1), opacity 0.6s cubic-bezier(.4,2,.6,1);
            opacity: 0;
            z-index: 2;
        }
        .photo-anim-img.loaded {
            opacity: 1;
        }
        .photo-anim-img.fanned {
            /* Will be set by JS for each image */
        }
        .photo-anim-img.grid {
            /* Will be set by JS for each image */
            transition: all 1s cubic-bezier(.4,2,.6,1);
        }
        @media (max-width: 600px) {
            .photo-anim-img { width: 90vw; }
        }
        .loading-placeholder {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            background: #f3f3f3;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            z-index: 1;
        }
    </style>
</head>
<body class="bg-white font-sans min-h-screen">
    <!-- Loading Placeholder -->
    <!-- <div id="loading-placeholder" class="loading-placeholder"></div> -->
    
    <!-- Modal HTML -->
    <div id="photo-modal" style="display:none; position:fixed; z-index:50; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
        <span id="modal-close" style="position:absolute; top:32px; right:48px; color:white; font-size:2.5rem; cursor:pointer; z-index:51;">&times;</span>
        <img id="modal-img" src="" alt="modal photo" style="max-width:90vw; max-height:90vh; box-shadow:0 4px 32px rgba(0,0,0,0.5);" />
    </div>
    <!-- Header -->
    <header class="px-4 sm:px-8 pt-4 sm:pt-6 ml-5 mt-7">
        <h1 class="text-3xl sm:text-3xl md:text-5xl lg:text-5xl xl:text-5xl font-extrabold tracking-tight text-black">ELIZABETH ZHU</h1>
        <nav class="mt-3 flex flex-wrap gap-2 sm:gap-3 md:gap-4 text-gray-500 text-base sm:text-md md:text-lg lg:text-xl lowercase overflow-x-auto">
            <a href="/index.html" class="hover:text-black whitespace-nowrap">about</a>
            <a href="#" class="text-black font-semibold border-b-2 border-black whitespace-nowrap" onclick="resetAndReload(); return false;">photography</a>
            <a href="/accra.html" class="hover:text-black whitespace-nowrap">accra</a>
            <a href="/paris.html" class="hover:text-black whitespace-nowrap">paris</a>
            <a href="/new-york.html" class="hover:text-black whitespace-nowrap">new york</a>
            <a href="/sf.html" class="hover:text-black whitespace-nowrap">san francisco</a>
        </nav>
    </header>
    <!-- Main Gallery Grid -->
    <div id="main-gallery" style="opacity:1; pointer-events:auto; transition:opacity 0.8s;">
        <main class="px-2 sm:px-8 pb-12 py-2 ml-5 mr-5 mt-6">
            <div class="masonry">
                <div class="masonry-column" id="column1"></div>
                <div class="masonry-column" id="column2"></div>
                <div class="masonry-column" id="column3"></div>
            </div>
        </main>
    </div>
<script>

// Modal functionality
const modal = document.getElementById('photo-modal');
const modalImg = document.getElementById('modal-img');
const closeBtn = document.getElementById('modal-close');

// Function to reset animation and reload page
function resetAndReload() {
    localStorage.removeItem('hasSeenAnimation');
    window.location.reload();
}

// Photo list
const photoList = [

    'accra/Zhu_4.jpg', 'water.jpg', 'light.jpg', 'accra/Zhu_3.jpg', 'reyes.jpg', 'canoe.jpg',
    'steps.jpg', 'tree.jpg', 'cntower.jpg', 'vaurigard.jpg', 'morebirds.jpg', 'nyclibrary.jpg', 'geese.jpg', 'shadows.jpg',
    'parisroof.jpg', 'accra/Zhu_6.jpg', 'swans.jpg', 'coffeebeans.jpg', 'compagnie.jpg', 'sfshore.jpg',
    'maubert.jpg', 'skater.jpg', 'seine.jpg', 'lightonbuildings.jpg', 'boats.jpg', 'goats.jpg', 'sfstreetview.jpg',
    'palacefinearts.jpg', 'treebuilding.jpg', 'building.jpg', 'nyctower.jpg', 'sfview.jpg',
    'bike.jpg', 'beach.jpg', 'sfhouse.jpg', 'whaletree.jpg', 'accra/Zhu_10.jpg',

    'cypress2.jpg', 'accra/Zhu_7.jpg', 'birds.jpg', 'accra/Zhu_5.jpg', 'accra/Zhu_9.jpg',

const photoDimensions = {

    'accra/Zhu_7.jpg': [1800, 1200],
    'accra/Zhu_8.jpg': [1800, 1200],
    'accra/Zhu_9.jpg': [1800, 1200],
    'accra/Zhu_10.jpg': [1800, 1200],
    'beach.jpg': [1200, 800],

// add light photo in nyc

// Create and add images to the gallery
const column1 = document.getElementById('column1');
const column2 = document.getElementById('column2');
const column3 = document.getElementById('column3');
const columns = [column1, column2, column3];

// Enhanced image loading with staggered fade-in
let loadedImages = 0;
const totalImages = photoList.length;
const initialRevealCount = 9;
const columnHeights = columns.map(() => 0);

function getBalancedColumnIndex(width, height) {
    const shortestHeight = Math.min(...columnHeights);
    const columnIndex = columnHeights.indexOf(shortestHeight);

    columnHeights[columnIndex] += height / width;
    return columnIndex;
}

photoList.forEach((src, i) => {
    const img = document.createElement('img');
    const [width, height] = photoDimensions[src] || [1200, 800];

    img.alt = src.split('.')[0];
    img.width = width;
    img.height = height;
    img.decoding = 'async';
    img.loading = i < initialRevealCount ? 'eager' : 'lazy';
    img.fetchPriority = i < initialRevealCount ? 'high' : 'low';
    img.dataset.index = i;
    img.style.cursor = 'pointer';
    
    // Add loading shimmer effect
    img.classList.add('loading');

    img.addEventListener('load', () => {
        revealWhenReady(img);
    }, { once: true });

    img.addEventListener('error', () => {
        img.classList.remove('loading');
    }, { once: true });
    
    // Add click handler for modal
    img.addEventListener('click', function() {
        modal.style.display = 'flex';
        modalImg.src = this.src;
        modalImg.alt = this.alt;
    });
    
    // Place each image in the shortest estimated column for even bottoms.
    const columnIndex = getBalancedColumnIndex(width, height);
    columns[columnIndex].appendChild(img);

    if (i < initialRevealCount) {
        img.dataset.inView = 'true';
    }

    img.src = `public/${src}`;
    revealWhenReady(img);
});

function revealWhenReady(img) {
    if (!img.dataset.inView || img.classList.contains('fade-in') || img.dataset.revealing) {
        return;
    }

    const reveal = () => {
        if (img.classList.contains('fade-in') || img.dataset.revealing) {
            return;
        }

        img.dataset.revealing = 'true';
        const delay = (Number(img.dataset.index) % 3) * 70;

        setTimeout(() => {
            img.classList.remove('loading');
            requestAnimationFrame(() => {
                img.classList.add('fade-in');
                loadedImages++;

                if (loadedImages % 10 === 0 || loadedImages === totalImages) {
                    console.log(`Loaded ${loadedImages}/${totalImages} images`);
                }
            });
        }, delay);
    };

    if (img.complete && img.naturalWidth > 0) {
        if (img.decode) {
            img.decode().catch(() => {}).finally(reveal);
        } else {
            reveal();
        }
    } else if (img.complete) {
        img.classList.remove('loading');
    }
}

// Fade images in as they approach the viewport, after they are decoded.
const imageObserver = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const img = entry.target;
            img.dataset.inView = 'true';
            revealWhenReady(img);
            observer.unobserve(img);
        }
    });
}, {
    threshold: 0,
    rootMargin: '300px 0px'
});

// Observe all images for lazy loading
document.querySelectorAll('.masonry-column img').forEach(img => {
    if (img.dataset.inView) {
        revealWhenReady(img);
    } else {
        imageObserver.observe(img);
    }
});

// Close modal on close button
closeBtn.addEventListener('click', function() {
    modal.style.display = 'none';
    modalImg.src = '';
});

// Close modal when clicking outside the image
modal.addEventListener('click', function(e) {
    if (e.target === modal) {
        modal.style.display = 'none';
        modalImg.src = '';
    }
});

// Close modal on Escape key
window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        modal.style.display = 'none';
        modalImg.src = '';
    }
});
</script>
