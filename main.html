<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Zhu Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .masonry {
            display: flex;
            gap: 0.5rem;
            padding: 0;
        }
        .masonry-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .masonry img {
            width: 100%;
            height: auto;
            border-radius: 0;
            display: block;
            background: #f3f3f3;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            loading: lazy;
            will-change: opacity, transform;
        }
        @media (max-width: 639px) {
            .masonry {
                flex-direction: column;
            }
        }
        .masonry img.fade-in {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .masonry img.loading {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .photo-anim-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            min-height: 600px;
            overflow: visible;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .photo-anim-container.loaded {
            opacity: 1;
        }
        .photo-anim-img {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 420px;
            max-width: 80vw;
            height: auto;
            transform: translate(-50%, -50%) scale(1);
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            transition: transform 0.6s cubic-bezier(.4,2,.6,1), left 0.6s cubic-bezier(.4,2,.6,1), top 0.6s cubic-bezier(.4,2,.6,1), opacity 0.6s cubic-bezier(.4,2,.6,1);
            opacity: 0;
            z-index: 2;
        }
        .photo-anim-img.loaded {
            opacity: 1;
        }
        .photo-anim-img.fanned {
            /* Will be set by JS for each image */
        }
        .photo-anim-img.grid {
            /* Will be set by JS for each image */
            transition: all 1s cubic-bezier(.4,2,.6,1);
        }
        @media (max-width: 600px) {
            .photo-anim-img { width: 90vw; }
        }
        .loading-placeholder {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            background: #f3f3f3;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            z-index: 1;
        }
    </style>
</head>
<body class="bg-white font-sans min-h-screen">
    <!-- Loading Placeholder -->
    <!-- <div id="loading-placeholder" class="loading-placeholder"></div> -->
    
    <!-- Modal HTML -->
    <div id="photo-modal" style="display:none; position:fixed; z-index:50; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
        <span id="modal-close" style="position:absolute; top:32px; right:48px; color:white; font-size:2.5rem; cursor:pointer; z-index:51;">&times;</span>
        <img id="modal-img" src="" alt="modal photo" style="max-width:90vw; max-height:90vh; box-shadow:0 4px 32px rgba(0,0,0,0.5);" />
    </div>
    <!-- Header -->
    <header class="px-4 sm:px-8 pt-4 sm:pt-6 ml-5 mt-7">
        <h1 class="text-3xl sm:text-3xl md:text-5xl lg:text-5xl xl:text-5xl font-extrabold tracking-tight text-black">ELIZABETH ZHU</h1>
        <nav class="mt-3 flex flex-wrap gap-2 sm:gap-3 md:gap-4 text-gray-500 text-base sm:text-md md:text-lg lg:text-xl lowercase overflow-x-auto">
            <a href="/index.html" class="hover:text-black whitespace-nowrap">about</a>
            <!-- <a href="contact.html" class="hover:text-black whitespace-nowrap">contact</a> -->
            <a href="#" class="text-black font-semibold border-b-2 border-black whitespace-nowrap" onclick="resetAndReload(); return false;">photography</a>
            <!-- <a href="/sf.html" class="hover:text-black whitespace-nowrap">san francisco</a> -->
            <!-- <a href="/trees.html" class="hover:text-black whitespace-nowrap">trees</a>
            <a href="/animals.html" class="hover:text-black whitespace-nowrap">animals</a> -->
        </nav>
    </header>
    <!-- Main Gallery Grid -->
    <div id="main-gallery" style="opacity:1; pointer-events:auto; transition:opacity 0.8s;">
        <main class="px-2 sm:px-8 pb-12 py-2 ml-5 mr-5 mt-6">
            <div class="masonry">
                <div class="masonry-column" id="column1"></div>
                <div class="masonry-column" id="column2"></div>
                <div class="masonry-column" id="column3"></div>
            </div>
        </main>
    </div>
    </main>
<script>

// Modal functionality
const modal = document.getElementById('photo-modal');
const modalImg = document.getElementById('modal-img');
const closeBtn = document.getElementById('modal-close');

// Function to reset animation and reload page
function resetAndReload() {
    localStorage.removeItem('hasSeenAnimation');
    window.location.reload();
}

// Photo list
const photoList = [
    'sf.jpg', 'tabac.jpg', 'maubert.jpg', 'tree.jpg', 'sfstreetview.jpg', 'parisroof.jpg', 'steps.jpg', 'vaurigard.jpg', 'benchsf.jpg', 
    'monkey.jpg', 'lightonbuildings.jpg', 'redcar.jpg', 'compagnie.jpg', 'goats1.jpg', 'sfshore.jpg', 'seine.jpg', 'coffeebeans.jpg','beads.jpg','yosemitetrees.jpg',  'boats.jpg', 'reddoor.jpg', 'mirror.jpg', 'ibipuera.jpg', 'painter.jpg', 'mustard.jpg', 'cypress.jpg', 
    'palacefinearts.jpg', 'treebuilding.jpg', 
    'building.jpg', 'reyes.jpg', 'nyctower.jpg', 'bike.jpg', 'paris.jpg', 'cntower1.jpg','nyc.jpg', 'yosemite.jpg', 'beach.jpg', 'canoe1.jpg', 'water.jpg', 'sfhouse.jpg', 'whaletree.jpg', 'nycstreet.jpg', 'sfwoman.jpg', 'sfbuilding.jpg', 'goldengate.jpg', 'leaves.jpg',  'sfcrispbuilding.jpg'
];

// add light photo in nyc

// Create and add images to the gallery
const column1 = document.getElementById('column1');
const column2 = document.getElementById('column2');
const column3 = document.getElementById('column3');
const columns = [column1, column2, column3];

// Enhanced image loading with staggered fade-in
let loadedImages = 0;
const totalImages = photoList.length;

photoList.forEach((src, i) => {
    const img = document.createElement('img');
    img.src = `/public/${src}`;
    img.alt = src.split('.')[0];
    img.loading = 'lazy';
    img.style.cursor = 'pointer';
    
    // Add loading shimmer effect
    img.classList.add('loading');
    
    // Add click handler for modal
    img.addEventListener('click', function() {
        modal.style.display = 'flex';
        modalImg.src = this.src;
        modalImg.alt = this.alt;
    });
    
    // Distribute images evenly across 3 columns
    const totalImages = photoList.length;
    const imagesPerColumn = Math.ceil(totalImages / 3);
    const columnIndex = Math.floor(i / imagesPerColumn);
    columns[columnIndex].appendChild(img);
});

// Enhanced fade-in with intersection observer and staggered timing
const imageObserver = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const img = entry.target;
            
            // Remove loading shimmer
            img.classList.remove('loading');
            
            // Add staggered delay based on column position
            const columnIndex = Array.from(columns).indexOf(img.parentElement);
            const delay = columnIndex * 100; // 100ms delay between columns
            
            setTimeout(() => {
                img.classList.add('fade-in');
                loadedImages++;
                
                // Optional: Log progress
                if (loadedImages % 10 === 0 || loadedImages === totalImages) {
                    console.log(`Loaded ${loadedImages}/${totalImages} images`);
                }
            }, delay);
            
            observer.unobserve(img);
        }
    });
}, {
    threshold: 0.1,
    rootMargin: '50px'
});

// Observe all images for lazy loading
document.querySelectorAll('.masonry-column img').forEach(img => {
    imageObserver.observe(img);
    
    // Fallback for images that might already be cached
    if (img.complete) {
        img.classList.remove('loading');
        const columnIndex = Array.from(columns).indexOf(img.parentElement);
        const delay = columnIndex * 100;
        setTimeout(() => {
            img.classList.add('fade-in');
        }, delay);
    }
});

// Close modal on close button
closeBtn.addEventListener('click', function() {
    modal.style.display = 'none';
    modalImg.src = '';
});

// Close modal when clicking outside the image
modal.addEventListener('click', function(e) {
    if (e.target === modal) {
        modal.style.display = 'none';
        modalImg.src = '';
    }
});

// Close modal on Escape key
window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        modal.style.display = 'none';
        modalImg.src = '';
    }
});
</script>
</body>
</html>
