<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Zhu | Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100vh;
            overflow-y: hidden;
        }
        .collage-scroll {
            position: relative;
            width: 3000px;
            height: calc(100vh - 175px);
            overflow: visible;
        }
        .collage-outer {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100vw;
            height: calc(100vh - 175px);
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
            overscroll-behavior-x: contain;
        }
        .collage-outer::-webkit-scrollbar {
            display: none;  /* Chrome, Safari and Opera */
        }
        .collage-img {
            position: absolute;
            /* border-radius: 1rem; */
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            object-fit: contain;
        }
        .city-strip {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 24px 48px 24px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
            overscroll-behavior-x: contain;
        }
        .gallery-photo {
            width: auto;
            height: min(57vw, calc(100vh - 240px));
            max-width: 90vw;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
        }
        .fade-in {
            opacity: 0;
            transition: opacity 0.8s;
        }
        .fade-in.loaded {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-white font-sans min-h-screen">
    <header class="px-4 sm:px-8 pt-6 sm:pt-8 mt-5 ml-5">
        <h1 class="text-3xl sm:text-5xl md:text-2xl lg:text-3xl xl:text-5xl font-extrabold tracking-tight text-black">ELIZABETH ZHU</h1>
        <nav class="mt-3 flex flex-wrap gap-2 sm:gap-3 md:gap-4 text-gray-500 text-base sm:text-md md:text-lg lg:text-xl lowercase overflow-x-auto">
            <a href="/index.html" class="hover:text-black whitespace-nowrap">about</a>
            <a href="/main.html" class="hover:text-black whitespace-nowrap">photography</a>
            <a href="/accra.html" class="hover:text-black whitespace-nowrap">accra</a>
            <a href="/paris.html" class="hover:text-black whitespace-nowrap">paris</a>
            <a href="/new-york.html" class="hover:text-black whitespace-nowrap">new york</a>
            <a href="/sf.html" class="text-black font-semibold border-b-2 border-black whitespace-nowrap">san francisco</a>
        </nav>
    </header>
    <main class="px-4 sm:px-8 pb-32 ml-5">
        <!-- Scattered Collage Gallery of San Francisco Photos with Horizontal Scroll -->
        <div class="collage-outer">
            <div class="city-strip">
                        <img data-src="/public/sf.jpg" class="gallery-photo" width="1200" height="800" alt="sf1" loading="lazy" />
        <img data-src="/public/sfview.jpg" class="gallery-photo" width="1200" height="800" alt="sf5" loading="lazy" />
        <img data-src="/public/sfhouse.jpg" class="gallery-photo" width="1200" height="800" alt="sf7" loading="lazy" />
        <img data-src="/public/water.jpg" class="gallery-photo" width="1200" height="800" alt="sf3" loading="lazy" />
        <img data-src="/public/sfstreetview.jpg" class="gallery-photo" width="1200" height="800" alt="sf6" loading="lazy" />
        <img data-src="/public/sfcrispbuilding.jpg" class="gallery-photo" width="1200" height="800" alt="sf4" loading="lazy" />
        <img data-src="/public/sfshore.jpg" class="gallery-photo" width="1200" height="800" alt="sf2" loading="lazy" />
        <img data-src="/public/sfwoman.jpg" class="gallery-photo" width="1200" height="800" alt="sf8" loading="lazy" />
        <img data-src="/public/sfbuilding.jpg" class="gallery-photo" width="1200" height="800" alt="sf3" loading="lazy" />
        <img data-src="/public/benchsf.jpg" class="gallery-photo" width="1200" height="800" alt="sf3" loading="lazy" />
        <img data-src="/public/bench.jpg" class="gallery-photo" width="1200" height="800" alt="sf3" loading="lazy" />
            </div>
            <style>
                /* Hide scrollbar for all browsers */
                .collage-outer > div::-webkit-scrollbar { display: none; }
                .collage-outer > div { -ms-overflow-style: none; scrollbar-width: none; }
            </style>
        </div>
    </main>
    <script>
        const scrollContainer = document.querySelector('.collage-outer > div');
        let totalWidth = 0;

        function updateScrollableWidth() {
            totalWidth = scrollContainer.scrollWidth - scrollContainer.clientWidth;
        }

        window.addEventListener('scroll', () => {
            const scrollProgress = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
            scrollContainer.scrollLeft = totalWidth * scrollProgress;
        });
        window.addEventListener('resize', updateScrollableWidth);

        document.querySelectorAll('.collage-outer img').forEach((img, index) => {
            img.classList.add('fade-in');
            img.decoding = 'async';
            img.loading = index < 4 ? 'eager' : 'lazy';
            img.fetchPriority = index < 4 ? 'high' : 'low';

            const reveal = () => {
                updateScrollableWidth();
                requestAnimationFrame(() => {
                    img.classList.add('loaded');
                });
            };

            img.addEventListener('load', function() {
                if (this.decode) {
                    this.decode().catch(() => {}).finally(reveal);
                } else {
                    reveal();
                }
            }, { once: true });

            img.addEventListener('error', function() {
                this.classList.remove('fade-in');
                updateScrollableWidth();
            }, { once: true });

            img.src = img.dataset.src;

            if (img.complete && img.naturalWidth > 0) {
                if (img.decode) {
                    img.decode().catch(() => {}).finally(reveal);
                } else {
                    reveal();
                }
            }
        });

        requestAnimationFrame(() => {
            updateScrollableWidth();
        });
    </script>
</body>
</html>
