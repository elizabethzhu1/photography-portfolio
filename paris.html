<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Zhu | Paris</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
    <style>
        .name-serif {
            font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', Times, serif;
            font-weight: 500;
            letter-spacing: 0;
        }
        :root {
            --sidebar-width: 300px;
            --content-gap: 12px;
            --city-top-offset: 64px;
            --photo-max-height: 1200px;
        }
        .site-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            padding: 64px 48px;
            background: #fff;
            z-index: 30;
        }
        .site-title {
            margin: 0;
            color: #000;
            font-size: 3rem;
            line-height: 0.95;
            font-weight: 500 !important;
            letter-spacing: 0;
        }
        .site-nav {
            margin-top: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.75rem;
            color: #666;
            font-size: 1.12rem;
            line-height: 1.3;
            text-transform: lowercase;
            overflow: visible;
        }
        .site-nav a {
            white-space: nowrap;
            border-bottom: 2px solid transparent;
        }
        .site-nav a:hover {
            color: #000;
        }
        .site-nav a.text-black {
            border-bottom-color: #000;
        }
        .sidebar-meta {
            margin-top: 1rem;
            color: #777;
            font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', Times, serif;
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.35;
            text-transform: lowercase;
        }
        .site-content {
            margin-left: calc(var(--sidebar-width) + var(--content-gap));
        }
        .about-content {
            max-width: 760px;
            padding: 64px 56px 56px 0;
        }
        .main-gallery-content {
            padding: 64px 56px 56px 0;
        }
        .city-content {
            margin-left: calc(var(--sidebar-width) + var(--content-gap));
            width: calc(100vw - var(--sidebar-width) - var(--content-gap));
            padding: var(--city-top-offset) 0 0 0;
        }
        @media (max-width: 767px) {
            .site-sidebar {
                position: static;
                width: auto;
                padding: 24px 24px 10px;
            }
            .site-title {
                font-size: 3rem;
                line-height: 1;
            }
            .site-nav {
                margin-top: 0.65rem;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 0.5rem 1rem;
                font-size: 1.02rem;
            }
            .sidebar-meta {
                margin-top: 0.75rem;
                font-size: 0.78rem;
            }
            html, body {
                height: auto;
                overflow-y: auto;
            }
            .site-content {
                margin-left: 0;
            }
            .about-content,
            .main-gallery-content,
            .city-content {
                width: 100%;
                margin-left: 0;
                padding: 20px 0 40px 24px;
            }
        }
        html, body {
            height: 100vh;
            overflow-y: hidden;
        }
        .collage-outer {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            height: calc(100vh - 104px);
            -ms-overflow-style: none;
            scrollbar-width: none;
            overscroll-behavior-x: contain;
        }
        .collage-outer::-webkit-scrollbar,
        .collage-outer > div::-webkit-scrollbar {
            display: none;
        }
        .collage-outer > div {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .city-strip {
            display: flex;
            gap: 16px;
            align-items: center;
            overflow-x: auto;
            padding: 0 0 24px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
            overscroll-behavior-x: contain;
        }
        .gallery-photo {
            width: auto;
            height: min(calc(100vh - var(--city-top-offset)), var(--photo-max-height));
            max-height: var(--photo-max-height);
            max-width: none;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
            cursor: pointer;
            box-shadow: 0 0 0 0 #000;
            transition: box-shadow 0.18s ease;
        }
        .gallery-photo:hover {
            box-shadow: 0 0 0 2px #000;
        }
        .fade-in {
            opacity: 0;
            transition: opacity 0.8s, box-shadow 0.18s ease;
        }
        .fade-in.loaded {
            opacity: 1;
        }
        @media (max-width: 767px) {
            html, body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .site-sidebar {
                padding: 22px 20px 10px;
            }
            .site-title {
                font-size: 2.6rem;
            }
            .city-content {
                width: 100%;
                margin-left: 0;
                padding: 22px 0 44px;
                box-sizing: border-box;
            }
            .collage-outer {
                width: 100%;
                height: auto;
                overflow-x: auto;
                overflow-y: hidden;
            }
            .city-strip {
                gap: 14px;
                align-items: flex-start;
                padding: 0 20px 36px;
            }
            .gallery-photo {
                width: auto;
                height: 72vh;
                height: 72dvh;
                max-width: none;
                max-height: none;
                flex: 0 0 auto;
            }
            #modal-close {
                top: 18px !important;
                right: 22px !important;
            }
            #modal-img {
                max-width: 92vw !important;
                max-height: 82vh !important;
            }
        }
    </style>
</head>
<body class="bg-white font-sans min-h-screen">
    <header class="site-sidebar">
        <h1 class="site-title name-serif">Elizabeth Zhu</h1>
        <nav class="site-nav">
            <a href="/main.html" class="hover:text-black whitespace-nowrap">about</a>
            <a href="/" class="hover:text-black whitespace-nowrap">gallery</a>
            <a href="/accra.html" class="hover:text-black whitespace-nowrap">accra</a>
            <a href="/paris.html" class="text-black font-semibold border-b-2 border-black whitespace-nowrap">paris</a>
            <a href="/new-york.html" class="hover:text-black whitespace-nowrap">new york</a>
            <a href="/sf.html" class="hover:text-black whitespace-nowrap">san francisco</a>
        </nav>
        <p class="sidebar-meta">058 photos · currently SF · 06 countries</p>
    </header>
    <div id="photo-modal" style="display:none; position:fixed; z-index:50; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
        <span id="modal-close" style="position:absolute; top:32px; right:48px; color:white; font-size:2.5rem; cursor:pointer; z-index:51;">&times;</span>
        <img id="modal-img" src="" alt="modal photo" style="max-width:90vw; max-height:90vh; box-shadow:0 4px 32px rgba(0,0,0,0.5);" />
    </div>
    <main class="site-content city-content">
        <div class="collage-outer">
            <div class="city-strip">
                <img src="/public/paris/parisroof.jpg" class="gallery-photo" width="1800" height="1200" alt="paris roof" loading="eager" fetchpriority="high" />
                <img src="/public/paris/compagnie.jpg" class="gallery-photo" width="1800" height="1200" alt="paris compagnie" loading="eager" fetchpriority="high" />
                <img src="/public/paris/seine.jpg" class="gallery-photo" width="1800" height="1200" alt="paris seine" loading="eager" fetchpriority="high" />
                <img src="/public/paris/vaurigard.jpg" class="gallery-photo" width="1800" height="1200" alt="paris vaurigard" loading="eager" fetchpriority="high" />
                <img src="/public/paris/boats.jpg" class="gallery-photo" width="1800" height="1200" alt="paris boats" loading="lazy" />
                <img src="/public/paris/canoe.jpg" class="gallery-photo" width="1800" height="1200" alt="paris canoe" loading="lazy" />
                <img src="/public/paris/maubert.jpg" class="gallery-photo" width="1800" height="1200" alt="paris maubert" loading="lazy" />
                <img src="/public/paris/mirror.jpg" class="gallery-photo" width="1800" height="1200" alt="paris mirror" loading="lazy" />
                <img src="/public/paris/bike.jpg" class="gallery-photo" width="1800" height="1200" alt="paris bike" loading="lazy" />
                <img src="/public/paris/geese.jpg" class="gallery-photo" width="1800" height="1200" alt="paris geese" loading="lazy" />
            </div>
        </div>
    </main>
    <script>
        const modal = document.getElementById('photo-modal');
        const modalImg = document.getElementById('modal-img');
        const closeBtn = document.getElementById('modal-close');
        const scrollContainer = document.querySelector('.collage-outer > div');
        let totalWidth = 0;

        function updateScrollableWidth() {
            totalWidth = scrollContainer.scrollWidth - scrollContainer.clientWidth;
        }

        window.addEventListener('scroll', () => {
            const scrollProgress = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
            scrollContainer.scrollLeft = totalWidth * scrollProgress;
        });
        window.addEventListener('resize', updateScrollableWidth);

        document.querySelectorAll('.collage-outer img').forEach((img, index) => {
            img.classList.add('fade-in');
            img.decoding = 'async';
            img.loading = index < 4 ? 'eager' : 'lazy';
            img.fetchPriority = index < 4 ? 'high' : 'low';

            img.addEventListener('click', function() {
                modal.style.display = 'flex';
                modalImg.src = this.currentSrc || this.src;
                modalImg.alt = this.alt;
            });

            const reveal = () => {
                updateScrollableWidth();
                requestAnimationFrame(() => {
                    img.classList.add('loaded');
                });
            };

            img.addEventListener('load', function() {
                if (this.decode) {
                    this.decode().catch(() => {}).finally(reveal);
                } else {
                    reveal();
                }
            }, { once: true });

            img.addEventListener('error', function() {
                this.classList.remove('fade-in');
                updateScrollableWidth();
            }, { once: true });

            if (img.complete && img.naturalWidth > 0) {
                if (img.decode) {
                    img.decode().catch(() => {}).finally(reveal);
                } else {
                    reveal();
                }
            }
        });

        requestAnimationFrame(() => {
            updateScrollableWidth();
        });

        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
            modalImg.src = '';
        });

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.style.display = 'none';
                modalImg.src = '';
            }
        });

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                modal.style.display = 'none';
                modalImg.src = '';
            }
        });
    </script>
</body>
</html>
